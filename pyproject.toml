[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yufu-sdk"
dynamic = ["version"]
description = "Runtime SDK for yufu: OIDC discovery, PKCE, token refresh, JWKS verification, introspection and back-channel logout."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bin-hy" }]
keywords = ["oidc", "oauth2", "yufu", "sdk", "authentication", "jwt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=42",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Bin-hy/yufu-sdk-python"
Repository = "https://github.com/Bin-hy/yufu-sdk-python"
Issues = "https://github.com/Bin-hy/yufu-sdk-python/issues"
Documentation = "https://github.com/Bin-hy/yufu-sdk-python#readme"

[tool.hatch.version]
path = "src/yufu/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yufu"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = [".contract", ".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["yufu"]
mypy_path = "src"
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["yufu"]

[tool.coverage.report]
show_missing = true
skip_covered = true
